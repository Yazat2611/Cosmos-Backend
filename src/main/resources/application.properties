spring.application.name=Cosmos Hub

spring.datasource.url=jdbc:postgresql://localhost:5432/Asteroid
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

# Flyway runs the scripts in db/migration. An existing database created by ddl-auto is baselined at
# version 1 the first time, so only V2 and later run on it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


nasa.api.base-url.cad=https://ssd-api.jpl.nasa.gov/cad.api
nasa.api.base-url.sbdb=https://ssd-api.jpl.nasa.gov/sbdb.api
nasa.api.base-url.donki=https://ccmc.gsfc.nasa.gov/DONKI-API/get
nasa.api.base-url.eonet=https://eonet.gsfc.nasa.gov/api/v3
nasa.api.base-url.apod=https://science.nasa.gov/wp-json/wp/v2/apod-basic


server.port=8080

# Schedules (UTC). Details are refreshed only when missing or older than cosmos.details.max-age.
cosmos.schedule.fetch=0 0 * * * *
cosmos.schedule.details-interval=PT6H
cosmos.schedule.details-initial-delay=PT2M
cosmos.schedule.cleanup=0 30 3 * * *
cosmos.details.max-age=P7D
cosmos.details.request-gap=PT1S
